name: Build App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar para Windows
        run: npm run dist:win

      - name: Subir instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
```eof

### Pasos para asegurar que funcione:

1.  **Reemplaza todo el contenido** de tu archivo `.github/workflows/release.yml` por el código de arriba.
2.  **No uses tabuladores**, asegúrate de que todo esté indentado con espacios (mi bloque de código usa 2 espacios estándar que GitHub prefiere).
3.  Si después de esto te da error, verifica que no haya espacios extra al final de la línea `on:` o antes de `push:`.

