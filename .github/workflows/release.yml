name: Build App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar para Windows
        run: npm run dist:win

      - name: Subir instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema para Linux
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools fuse libnss3 libnspr4 libgbm-dev libasound2

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar para Linux
        run: npm run dist:linux

      - name: Subir AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
```eof

### ¿Qué corregimos?
Aseguramos que cada `uses` y `with` esté indentado con 2 espacios respecto a su `- name`. Si al copiar esto el error persiste, asegúrate de que no haya caracteres invisibles o pestañas (tabs) en tu archivo. ¡Inténtalo de nuevo y cuéntame si GitHub ya lo acepta!
