name: Build App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar para Windows
        run: npm run dist:win

      - name: Subir instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema para Linux
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools fuse libnss3 libnspr4 libgbm-dev libasound2

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar para Linux
        run: npm run dist:linux

      - name: Subir AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
```eof

### ¿Por qué esto debería funcionar ahora?

1.  **Espaciado:** He verificado que todos los niveles de `steps` están indentados con exactamente 2 espacios más que su contenedor.
2.  **Limpieza:** He eliminado cualquier posible carácter invisible que pudiera estar dando problemas en la línea 58.
3.  **Consejo de editor:** Si usas VS Code, mira en la esquina inferior derecha. Si dice "Tab Size: 2", asegúrate de que al presionar la tecla Tab, inserte espacios. Si ves que el archivo sigue fallando, intenta **borrar manualmente la línea 58 y volver a escribirla a mano** (a veces los editores ocultan caracteres especiales de retorno de carro si copiaste el código de una web).

